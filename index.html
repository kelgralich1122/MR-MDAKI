<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<!-- Three.js & Plugins via CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<!-- Canvas Confetti Library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<link rel="stylesheet" href="style.css">


<!-- 3D WebGL Canvas Container -->
<div id="canvas-container"></div>

<!-- Background Music -->
<audio id="bgSong" loop preload="auto">
    <source src="songs/track1.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

<!-- Stage 1: Proposal Card Overlay -->
<div class="overlay-wrapper" id="proposalOverlay">
    <div class="card" id="proposalCard">
        <div class="emoji-header" id="emojiHeader">🥺</div>
        <h1 id="cardHeading">Hey My Love! ❤️</h1>
        <p id="cardSubtext">I love you more than anything in this world. Will you be mine forever?</p>
        
        <div class="button-group" id="buttonGroup">
            <button id="yesBtn" class="btn btn-yes">Yes 💕</button>
            <button id="noBtn" class="btn btn-no">No 💔</button>
        </div>
    </div>
</div>

<!-- Stage 2: Interactive 3D World Floating Header -->
<div class="galaxy-ui hidden" id="galaxyUi">
    <h2 class="galaxy-title">Only For You ❤️</h2>
    <p class="galaxy-subtitle">Drag to rotate • Scroll/Pinch to zoom</p>
    <button id="musicToggle" class="music-btn">🎵 Pause Music</button>
</div>

<script src="script.js"></script>
