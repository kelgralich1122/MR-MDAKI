<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Only For You ❤️</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js for 3D Galaxy effect -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Overlay Text & UI -->
    <div id="ui-container">
        <h1>Only For You, ❤️</h1>
        <p>Double-click anywhere to interact. Drag to move, scroll to zoom.</p>
        <button id="playBtn">🎵 Play Our Song</button>
    </div>

    <!-- Background Audio -->
    <audio id="bgSong" loop>
        <source src="songs/track1.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script src="script.js"></script>
</body>
</html>
